name: Release

on:
  release:
    types: [published]

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libzstd-dev

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel $(nproc)

      - name: Rename artifact
        run: |
          cp build/libretro/mednafen_stv_libretro.so \
             mednafen_stv_libretro_linux_${{ matrix.arch }}.so

      - uses: actions/upload-artifact@v4
        with:
          name: mednafen_stv_libretro_linux_${{ matrix.arch }}
          path: mednafen_stv_libretro_linux_${{ matrix.arch }}.so

  upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: mednafen_stv_libretro_linux_*.so
